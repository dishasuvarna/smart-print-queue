<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Handout — CampusPrint</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#EFEDE6;--ink:#1A1A1A;--ribbon:#C8102E;--machine:#6B6B63;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;padding:32px 16px 64px;}
  .card{width:100%;max-width:420px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:28px;}
  h1{font-size:19px;margin:0 0 6px;}
  .meta{font-size:13px;color:var(--machine);margin:0 0 24px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;}
  input{width:100%;padding:12px;border:1.5px solid var(--ink);border-radius:4px;font-family:'Space Grotesk',sans-serif;font-size:15px;}
  input:focus{outline:none;border-color:var(--ribbon);}
  button{width:100%;padding:14px;background:var(--ink);color:var(--paper);border:none;border-radius:4px;font-size:15px;font-weight:500;cursor:pointer;}
</style>
</head>
<body>
    <div class="card">
        <h1>{{ handout.title }}</h1>
        <p class="meta">{{ handout.course_name }}{% if handout.lecturer_name %} · {{ handout.lecturer_name }}{% endif %} · ₹{{ handout.price_per_copy }}/copy</p>

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Email address</label>
                <input type="email" name="student_email" required>
            </div>
            <div class="field">
                <label>Number of copies</label>
                <input type="number" name="copies" value="1" min="1" required>
            </div>
            <button type="submit">Continue to payment</button>
        </form>
    </div>
</body>
</html>
