<!DOCTYPE html>
<html>
<head><title>Upload Print Job</title></head>
<body>
    <h2>Upload your PDF</h2>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>Email: <input type="email" name="student_email" required></p>
        <p>PDF file: <input type="file" name="file" required></p>
        <p>Copies: <input type="number" name="copies" value="1" min="1" required></p>
        <button type="submit">Place Order</button>
    </form>
</body>
</html>
