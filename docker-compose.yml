# Local development only. Production uses Supabase Postgres and Upstash
# Redis instead of these containers — same DATABASE_URL / REDIS_URL
# variable names, just pointed at different hosts (points 1, 2).
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_print
      POSTGRES_USER: smart_print
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
